<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubDomine Teke Over By Sharif Uddin</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ff0080, #ff8c00, #40e0d0, #7b2ff7, #00c853);
      background-size: 400% 400%;
      animation: bgMove 10s ease infinite;
    }

    h1 {
      font-size: 3.5rem;
      padding: 20px;
      background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 2px rgba(255,255,255,0.3);
      -webkit-text-stroke: 1px white;
      animation: textMove 4s linear infinite;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes textMove {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
  </style>
</head>
<body>
  <h1>SubDomine Teke Over By Sharif Uddin</h1>
</body>
</html>
